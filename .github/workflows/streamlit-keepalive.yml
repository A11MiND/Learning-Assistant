name: Streamlit Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Streamlit app
        env:
          APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Missing secret: STREAMLIT_APP_URL"
            exit 1
          fi

          code=$(curl -L -sS -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            "$APP_URL")

          echo "HTTP status: $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
            echo "Keepalive succeeded"
          else
            echo "Keepalive failed"
            exit 1
          fi
